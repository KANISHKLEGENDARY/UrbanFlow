# UrbanFlow — Prometheus Configuration
# Scrapes metrics from the FastAPI backend at /metrics

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # ── UrbanFlow API ──────────────────────────
  - job_name: "urbanflow-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "urbanflow"
          component: "api"

  # ── Prometheus self-monitoring ──────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
