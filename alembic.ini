# UrbanFlow — Alembic Configuration
#
# Migration management for the PostgreSQL database.
# Run with:  alembic upgrade head
#            alembic revision --autogenerate -m "description"

[alembic]
# Path to migration scripts
script_location = db/migrations

# Database URL — overridden at runtime by env.py from config.DATABASE_URL,
# but kept here as a fallback for standalone alembic CLI usage.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/urbanflow

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
